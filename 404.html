<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | AxiomApe</title>
  <meta name="description" content="The page you were looking for could not be found. Browse the full AxiomApe tool directory instead." />
  <meta name="robots" content="noindex, follow" />

  <script src="/js/site-chrome.js?v=6" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #161a24;
      --border:    rgba(255,255,255,0.07);
      --text:      #e8eaf0;
      --muted:     #7a8094;
      --accent:    #3B82F6;
      --radius:    14px;
      --ease:      0.22s cubic-bezier(.4,0,.2,1);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.25rem;
    }

    .panel {
      width: 100%;
      max-width: 34rem;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
    }

    .code {
      font-size: clamp(3.5rem, 12vw, 5rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    h1 {
      margin-top: 0.75rem;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 600;
    }

    p {
      margin-top: 0.85rem;
      color: var(--muted);
    }

    .actions {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      transition: background var(--ease), border-color var(--ease);
    }

    .btn:hover { background: rgba(255,255,255,0.05); }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: #2f6fd0; }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      padding: 1.5rem 1.25rem 2.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }

    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>
        This page doesn&rsquo;t exist, or it may have moved. The tool you want is
        probably still here &mdash; try the directory.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to Homepage</a>
        <a class="btn" href="/about.html">About AxiomApe</a>
      </div>
    </div>
  </main>

  <footer>
    <p>
      &copy; <span id="yr"></span> <a href="/">AxiomApe</a> &nbsp;&middot;&nbsp;
      <a href="/about.html">About</a> &nbsp;&middot;&nbsp;
      <a href="/contact.html">Contact</a> &nbsp;&middot;&nbsp;
      <a href="/privacy.html">Privacy Policy</a>
    </p>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>
</body>
</html>
